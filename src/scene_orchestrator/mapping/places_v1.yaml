# The places a participant's scene can be at (places v1).
#
# The mapper picks one of these by the persona's shelter (shelter_level) and,
# within that, novelty; see rule_mapper.py. Each is one Unity setting
# (archetype) with its axes set, plus the biome (props, sky colour, sounds).
# Only the light, fog, wind, prop density and colour vary from the persona;
# nothing here does.
#
#   setting        hollow | overlook | summit | forest | meadow | beach
#   biome          a kit in rule_mapper.BIOMES
#   landform       plain | bowl | ridge | peak | shore | terraces | valley
#   position       bottom | mid | top            where the participant sits
#   water          none | river | lake | sea
#   water_relation absent | beside | below | distant
#   vegetation     sparse | moderate | dense
#   season         spring | summer | autumn | winter; left out: the setting's
#   shelter_level  1 open .. 5 sheltered
#   novelty        0 familiar .. 1 unusual
#   status         candidate | verified | rejected
#   checked        the date of the last headset check, or null
#
# Every place is checked when it loads: the axis pairs Unity's SceneAxes
# accepts, the water against its relation, the setting's May/Must/Never rules,
# and a kit with water lilies only at a lake. A place Unity would change fails
# the load.
#
# After a headset check, flip the status with
#     python -m scene_orchestrator.places mark <id> verified|rejected --note "..."
# or edit status, checked and note here by hand. Only verified places are
# used unless configs/<name>.yaml sets places.allow_candidates; rejected
# places never are. Restart the server afterwards: it reads this file once.

places:
  - id: forest_lake
    setting: forest
    biome: forest_clearing
    landform: plain
    position: mid
    water: lake
    water_relation: beside
    vegetation: dense
    shelter_level: 5
    novelty: 0.2
    status: candidate
    checked: null
    note: ""

